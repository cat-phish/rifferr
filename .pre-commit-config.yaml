# Install once: pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^frontend/pnpm-lock\.yaml$  # pnpm 12 writes a multi-document lockfile
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-symlinks
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-format
        files: ^(backend|scripts)/
      - id: ruff-check
        files: ^(backend|scripts)/

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: pnpm -C frontend exec eslint --max-warnings=0
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: pnpm -C frontend exec prettier --check .
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: spec-lint
        name: spec lint
        entry: python3 scripts/spec.py lint
        language: system
        files: ^(specs/.*\.md|BACKLOG\.md)$
        pass_filenames: false
