# The author's reference import workflow (docs/original-checklist.md), as far as
# Rifferr can express it so far. It grows milestone by milestone; docs/coverage.md
# maps each checklist line to the step that does it, or the milestone that will.
#
# Copy it and release-suffixes.yaml (which it calls) into a profile's workflows/
# folder and the scripts they use from examples/scripts/ into the profile's scripts/
# folder, set `inbox` in the profile's vars, and trust it (`rifferr trust`, which
# trusts the called file too, each by its own hash). From then on every album folder that lands in
# the inbox is imported once it has stopped changing. To import the whole inbox by hand:
#   rifferr run foobar-style --profile main
# or one album:
#   rifferr run foobar-style --profile main --input "/path/to/inbox/Artist - Album"
name: foobar-style
description: >-
  Import new albums with beets, fix release-type suffixes, find missing covers, clean up,
  then move each album into the library after review.
vars:
  inbox:
    description: Folder with new albums to import (the checklist's "Stage 1, unsorted")
  library:
    description: The music library folder albums move into once reviewed
# Manual runs without --input import the whole inbox.
input: "{{ vars.inbox }}"
on:
  # Each top-level folder of the inbox is one run. Downloads can take a while to
  # finish writing, so wait until a folder has been quiet for five minutes.
  watch:
    path: "{{ vars.inbox }}"
    settle: 5m
steps:
  - id: import
    uses: beets.import
    with:
      path: "{{ run.input }}"
      # Strong matches import on their own; the rest wait in the review queue as import
      # decisions, holding only their own album.
      mode: auto
  # Release-type suffixes live in their own file, so other import workflows can call
  # them too. Its steps run here as suffixes/release-types and suffixes/compilations.
  - id: suffixes
    uses: workflow
    with:
      workflow: release-suffixes.yaml
  # Checklist line 6, album art: albums without art get the best cover from the
  # providers in the profile's `covers` settings (Cover Art Archive, local images,
  # iTunes and Deezer by default). When none scores well enough, only that album waits
  # in the review queue for a cover choice. The cover is a ChangeSet, so undo removes it.
  - id: art
    uses: covers.search
  # Checklist line 4: delete leftover junk and empty folders from the imported folder.
  # Music beets could import is never deleted (an unmatched album stays for line 5), nor
  # is a folder that still waits as an import decision: it is cleaned by the pass that
  # runs once the decision is made. Everything else that is left is logged as a warning.
  - id: cleanup
    uses: files.cleanup
    with:
      path: "{{ run.input }}"
      mode: delete
      delete: ["*.nfo", "*.m3u", "*.m3u8", "*.sfv", "*.url", "Thumbs.db", ".DS_Store"]
      keep: ["*.log", "*.cue"]
      # A manual run's input is the whole inbox, which must stay; the album folder of a
      # watch run is left empty instead (BACKLOG B-055).
      remove_root: false
  # Checklist lines 5, 13, 15, 17, 18, 19: rename and move each album into the library.
  # Albums are imported where they are (set `import: {copy: no, move: no}` in the
  # profile's beets config) and only move once a person accepts the move in the review
  # queue (`apply` defaults to review): one decision per album, showing the old and new
  # folder and every file's old and new name. Moves are journaled and undoable; a file
  # is never overwritten, and an album whose destination is taken waits in the queue as
  # a move conflict to retry once it's fixed.
  #
  # Names come from beets path formats, the equivalent of the author's foobar2000
  # pattern. `%the{}` needs the beets `the` plugin in the profile's beets config:
  #   plugins: [the]
  #   the: { a: no, format: "{0}, {1}" }
  # `%ifgreater` and `%unpad` are Rifferr's built-in template functions. `albumkind` is
  # the flexible attribute the classification rules set (checklist line 7, not yet).
  - id: into-library
    uses: library.move
    with:
      directory: "{{ vars.library }}"
      paths:
        # Splits and compilations: the year after the album name.
        - query: "albumkind::^(split|compilation)$"
          format: >-
            %the{$albumartist}/$album%if{$original_year, ($original_year)}
            [%if{%ifgreater{$bitdepth,16,1},24-bit }$format]/%ifgreater{$disctotal,1,Disc
            %unpad{$disc}/}$track. $title
        # Everything else: sorted by original year inside the artist folder, e.g.
        # "Beatles, The/(1969) Abbey Road [FLAC]/01. Come Together.flac".
        - query: default
          format: >-
            %the{$albumartist}/%if{$original_year,($original_year) }$album
            [%if{%ifgreater{$bitdepth,16,1},24-bit }$format]/%ifgreater{$disctotal,1,Disc
            %unpad{$disc}/}$track. $title
      # DATE ADDED (line 13): the day the album enters the library.
      stamp: { field: date_added }
      # Images other than the cover go in an Art sub-folder; everything else left after
      # cleanup (rip logs, cue sheets) keeps its place in the album folder.
      artifacts:
        - match: ["*.jpg", "*.jpeg", "*.png", "*.gif", "*.webp", "*.tif", "*.tiff", "*.bmp"]
          to: Art
        - "*"
