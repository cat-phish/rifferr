# The author's reference import workflow (docs/original-checklist.md), as far as
# Rifferr can express it so far. It grows milestone by milestone; docs/coverage.md
# maps each checklist line to the step that does it, or the milestone that will.
#
# Copy it and release-suffixes.yaml (which it calls) into a profile's workflows/
# folder and the scripts they use from examples/scripts/ into the profile's scripts/
# folder, set `inbox`, `staging` and `library` in the profile's vars, and trust it (`rifferr trust`, which
# trusts the called file too, each by its own hash). From then on every album folder that lands in
# the inbox is imported once it has stopped changing. To import the whole inbox by hand:
#   rifferr run foobar-style --profile main
# or one album:
#   rifferr run foobar-style --profile main --input "/path/to/inbox/Artist - Album"
name: foobar-style
description: >-
  Import new albums with beets, move them out of the inbox into a staging folder, move
  featured artists into titles, fix release-type suffixes, choose album kinds, fix dates,
  sort genres into broad buckets, find missing covers, add ReplayGain, then move each album
  into the library after review.
vars:
  inbox:
    description: Folder with new albums to import (the checklist's "Stage 1, unsorted")
  staging:
    description: >-
      Folder imported albums move into right away, where they are tagged and wait for
      review. The inbox only ever holds files nobody has touched.
  library:
    description: The music library folder albums move into once reviewed
  # The album artist (and its sort name) of each album kind, so these albums sort into
  # their own folders ("Split/", "Collaboration/", ...) on an iPod and in the library.
  label_split:
    description: Album artist of splits
    default: Split
  label_collab:
    description: Album artist of collaborations
    default: Collaboration
  label_soundtrack:
    description: Album artist of soundtracks
    default: Soundtrack
  label_compilation:
    description: Album artist of compilations
    default: Compilation
# Manual runs without --input import the whole inbox.
input: "{{ vars.inbox }}"
on:
  # Each top-level folder of the inbox is one run. Downloads can take a while to
  # finish writing, so wait until a folder has been quiet for five minutes.
  watch:
    path: "{{ vars.inbox }}"
    settle: 5m
    # A test inbox refilled with the same sample can add `dedupe: in_progress`, so a
    # folder seen before runs again (TRIGGERS-26). The default skips unchanged folders.
steps:
  - id: import
    uses: beets.import
    with:
      path: "{{ run.input }}"
      # Strong matches import on their own; the rest wait in the review queue as import
      # decisions, holding only their own album, and their files stay as they are.
      mode: auto
      # Import where the files are, but write no tags yet: the inbox keeps only
      # untouched files. Tags are written once the album is in staging (`write-tags`).
      # The profile's beets config needs `import: {copy: no, move: no}`.
      options: { write: no }
  # Move each imported album out of the inbox into staging at once, with every other
  # file in its folder (`artifacts` defaults to all of them): nothing is deleted, so
  # .nfo, .m3u, rip logs, cue sheets and scans all travel with the album (author,
  # 2026-11-22). It is journaled and undoable like any move, and needs no review:
  # staging is not the library.
  - id: to-staging
    uses: library.move
    apply: auto
    with:
      directory: "{{ vars.staging }}"
      paths: &album-paths
        # Splits, collaborations, soundtracks and compilations (album-kind): under the
        # kind's label, with the year after the album name.
        - query: "albumkind::^(split|collab|soundtrack|compilation)$"
          format: >-
            %the{$albumartist}/$album%if{$original_year, ($original_year)}
            [%if{%ifgreater{$bitdepth,16,1},24-bit }$format]/%ifgreater{$disctotal,1,Disc
            %unpad{$disc}/}$track. $title
        # Everything else: sorted by original year inside the artist folder, e.g.
        # "Beatles, The/(1969) Abbey Road [FLAC]/01. Come Together.flac".
        - query: default
          format: >-
            %the{$albumartist}/%if{$original_year,($original_year) }$album
            [%if{%ifgreater{$bitdepth,16,1},24-bit }$format]/%ifgreater{$disctotal,1,Disc
            %unpad{$disc}/}$track. $title
  # Now that the files are copies in staging, write the tags beets found into them.
  - id: write-tags
    uses: beets.command
    with:
      command: write
  # Featured artists: beets' ftintitle plugin moves "feat. X" from the artist into the
  # title ("A feat. B" / "Song" -> "A" / "Song (feat. B)"), so the album artist and the
  # artist folders name only the primary artist (author, 2026-11-23). Needs the plugin in
  # the profile's beets config, without running during import:
  #   plugins: [ftintitle]
  #   ftintitle: { auto: no, drop: no }
  - id: featured-artists
    uses: beets.command
    with:
      command: ftintitle
  # Release-type suffixes live in their own file, so other import workflows can call
  # them too. Its steps run here as suffixes/release-types and suffixes/compilations.
  - id: suffixes
    uses: workflow
    with:
      workflow: release-suffixes.yaml
  # Checklist lines 7, 9, 10, 18: every album with several album artists, an album artist
  # with a joiner ("A & B", "A / B"; joiners and known band names like AC/DC are in the
  # artist-name rules, `rifferr.artist_names` in the beets config) and every soundtrack or
  # compilation waits in the review queue for its kind (author, 2026-11-23). The likely
  # one is preselected:
  #   - collaboration when most tracks credit several artists (featured artists are in the
  #     titles by now),
  #   - split with 2 to 4 album artists,
  #   - soundtrack when beets says so, otherwise nothing.
  # Any option can be chosen, or the fields typed in. The album artist and its sort name
  # become the kind's label; the individual artists go to the multi-valued `albumartists`
  # (from MusicBrainz, or the album artist split at its joiners; editable in review).
  # "This is one artist" adds the album artist to the known names and leaves the album
  # unchanged. Albums already given a kind aren't asked again.
  - id: album-kind
    uses: tags.choose
    with:
      query: >-
        ^albumkind::. albumtypes:soundtrack ,
        ^albumkind::. albumtypes:compilation ,
        ^albumkind::. rf_count_albumartists:2.. ,
        ^albumkind::. rf_joined_albumartist:1
      known_name: albumartist
      known_name_option: Single artist
      show: [albumartist, albumartists, albumtypes]
      options:
        - label: Collaboration
          suggest: { when: "rf_share_multi_artist_tracks:51.." }
          actions:
            - &artists-from-albumartist
              when: "^albumkind::. rf_count_albumartists:..1"
              copy: { from: albumartist, to: albumartists }
            - &artists-at-joiners
              when: "^albumkind::. rf_count_albumartists:..1"
              replace: { fields: [albumartists], regex: '\s*(?:&|/|,| - | x | and )\s*', with: ";" }
            - &artists-split
              when: "^albumkind::. rf_count_albumartists:..1"
              split: { field: albumartists, by: ";" }
            - set:
                albumkind: collab
                albumartist: "{{ vars.label_collab }}"
                albumartist_sort: "{{ vars.label_collab }}"
        - label: Split
          suggest: { when: "rf_count_albumartists:2..4" }
          actions:
            - *artists-from-albumartist
            - *artists-at-joiners
            - *artists-split
            - set:
                albumkind: split
                albumartist: "{{ vars.label_split }}"
                albumartist_sort: "{{ vars.label_split }}"
        - label: Soundtrack
          suggest: { when: "albumtypes:soundtrack" }
          actions:
            - set:
                albumkind: soundtrack
                albumartist: "{{ vars.label_soundtrack }}"
                albumartist_sort: "{{ vars.label_soundtrack }}"
        - label: Compilation
          actions:
            - set:
                albumkind: compilation
                albumartist: "{{ vars.label_compilation }}"
                albumartist_sort: "{{ vars.label_compilation }}"
      custom: [albumartist, albumartists, albumkind]
  # Dates still missing: an album without a release date waits for one to be typed in
  # (`year`, `month`, `day`), and the original date if it differs. The dates step below
  # then does the copies.
  - id: dates-missing
    uses: tags.choose
    with:
      query: "year:0"
      show: [original_year, year, label, catalognum]
      custom: [year, month, day, original_year, original_month, original_day]
  # Checklist "Manage Dates/Years": an album without an original date takes the release
  # date; the release date is kept in `releasedate`, then DATE becomes the original date,
  # so albums sort by first release on an iPod and in folders (author, 2026-11-23).
  # Albums with no release date are left as they are.
  - id: dates
    uses: tags.script
    apply: auto
    with:
      script: dates.yaml
  # Checklist line 14, genres: beets' genres move to the multi-valued `subgenres`
  # (subgenres.yaml), then every album waits for its broad genre (author, 2026-11-23). The
  # buckets come from the profile's rules/genres.yaml (start from examples/rules/), ranked
  # by how many of the album's sub-genres each matches; sub-genres no rule knows are offered
  # as their top-level genre in beets lastgenre's genre tree. A bucket typed in review is
  # added to the rules file (`learn`), so the next album with those sub-genres gets it.
  - id: subgenres
    uses: tags.script
    apply: auto
    with:
      script: subgenres.yaml
  - id: genre-bucket
    uses: tags.choose
    with:
      show: [subgenres, genres]
      options_from: genres.yaml
      rank_by: subgenres
      custom: [genres]
      learn: true
  # Checklist line 6, album art: albums without art get a cover from the providers in
  # the profile's `covers` settings (Cover Art Archive, local images, iTunes and Deezer
  # by default). Every such album waits in the review queue with the ranked covers, best
  # first, so each added cover is seen before it's used (author, 2026-11-22); only that
  # album's lane waits. The cover is a ChangeSet, so undo removes it.
  # Albums that beets' fetchart gave art during import skip this step; their cover is
  # checked in the into-library review instead.
  - id: art
    uses: covers.search
    with:
      choose: review
  # Covers larger than 1200x1200 shrink to 1200 on their longest side; the original stays
  # next to the cover as cover-hires.jpg (author, 2026-11-22). Runs on every album, so a
  # cover fetchart found during import is resized too. Journaled; undo restores the original.
  - id: art-size
    uses: covers.resize
    with:
      max: 1200
      original: "{stem}-hires{ext}"
  # The album's folder in the inbox is empty now (or holds only what beets couldn't
  # import, which stays for checklist line 5): remove the empty folders.
  - id: empty-inbox
    uses: files.cleanup
    with:
      path: "{{ run.input }}"
      mode: delete
      remove_root: false
  # Checklist line 11: "/", ":" and "?" in album, title, artist and album artist become
  # lookalike characters (／ ꞉ ？), so folder and file names keep them instead of beets'
  # "_". Runs on its own before the move, so the move's preview shows the new names.
  - id: path-characters
    uses: tags.script
    apply: auto
    with:
      script: path-characters.yaml
  # ReplayGain (album and track gain) while the album is still in staging, before it
  # moves into the library (author, 2026-11-23). Needs the plugin in the profile's beets
  # config:
  #   plugins: [replaygain]
  #   replaygain: { backend: ffmpeg, auto: no }
  - id: replaygain
    uses: beets.command
    with:
      command: replaygain
      args: ["-a"]
  # Checklist lines 5, 13, 15, 17, 18, 19: rename and move each album from staging into
  # the library, only once a person accepts the move in the review queue (`apply`
  # defaults to review): one decision per album, showing the old and new
  # folder and every file's old and new name. Moves are journaled and undoable; a file
  # is never overwritten, and an album whose destination is taken waits in the queue as
  # a move conflict to retry once it's fixed.
  #
  # Names come from beets path formats, the equivalent of the author's foobar2000
  # pattern. `%the{}` needs the beets `the` plugin in the profile's beets config:
  #   plugins: [the]
  #   the: { a: no, format: "{0}, {1}" }
  # `%ifgreater` and `%unpad` are Rifferr's built-in template functions. `albumkind` is
  # the flexible attribute album-kind sets.
  - id: into-library
    uses: library.move
    with:
      directory: "{{ vars.library }}"
      # The same names as in staging, so the album only changes root folder.
      paths: *album-paths
      # DATE ADDED (line 13): the day the album enters the library.
      stamp: { field: date_added }
      # The final check before the library (LIBRARY-MOVE-18): the review shows the cover with
      # its size and these fields, plus every field this run changed, marked. The cover
      # beets' fetchart found during import is reviewed here (author, 2026-11-22).
      show:
        album: [albumartist, albumartists, albumartist_sort, album, albumtype, albumtypes,
                year, original_year, label, catalognum, country, media, albumstatus, genre,
                comp, disctotal, mb_albumid, mb_releasegroupid]
        item: [disc, track, tracktotal, title, artist, artists, length, format, bitrate,
               mb_trackid]
      # Images other than the cover go in an Art sub-folder; everything else that came
      # along (rip logs, cue sheets) keeps its place in the album folder.
      # The kept full-size cover (art-size) stays next to the cover; the first matching rule
      # wins.
      artifacts:
        - match: ["*-hires.*"]
        - match: ["*.jpg", "*.jpeg", "*.png", "*.gif", "*.webp", "*.tif", "*.tiff", "*.bmp"]
          to: Art
        - "*"
