[project]
name = "rifferr"
version = "0.0.0"
description = "A local web app for building and running user-defined music-import workflows, with beets as its primary library backend."
readme = "../README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "apprise>=2.2,<3",
    "argon2-cffi>=25,<26",
    "beets>=2.14,<2.15",
    "cronsim>=2.8",
    "fastapi>=0.162,<1",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "pillow>=13,<14",
    "pydantic>=2.10,<3",
    "regex>=2026.11.15",
    "ruamel-yaml>=0.18,<0.20",
    "uvicorn>=0.54,<1",
    "watchfiles>=1.3",
]

[project.optional-dependencies]
# Python packages that beets' bundled plugins need (BEETS-IMPORT-20, B-067). beets
# declares them as its own extras; these pass them through.
chroma = ["beets[chroma]"]
lastgenre = ["beets[lastgenre]"]
discogs = ["beets[discogs]"]
plugins = ["beets[chroma,lastgenre,discogs]"]

[dependency-groups]
dev = [
  "hypothesis",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "respx",
  "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

# Entry-point groups (public API, see rifferr/plugins.py). Built-ins register here
# exactly like third-party plugins.
[project.scripts]
rifferr = "rifferr.cli:main"

[project.entry-points."rifferr.steps"]
shell = "rifferr.steps.shell:ShellStep"
"beets.import" = "rifferr.steps.beets_import:BeetsImportStep"
"tags.script" = "rifferr.steps.tagscript:TagScriptStep"
"tags.choose" = "rifferr.steps.tags_choose:TagsChooseStep"
review = "rifferr.steps.review:ReviewStep"
"beets.command" = "rifferr.steps.beets_command:BeetsCommandStep"
notify = "rifferr.steps.notify:NotifyStep"
"files.cleanup" = "rifferr.steps.files_cleanup:FilesCleanupStep"
workflow = "rifferr.steps.workflow_call:WorkflowCallStep"
"covers.search" = "rifferr.steps.covers_search:CoversSearchStep"
"library.move" = "rifferr.steps.library_move:LibraryMoveStep"
"library.prune" = "rifferr.steps.library_prune:LibraryPruneStep"
"covers.resize" = "rifferr.steps.covers_resize:CoversResizeStep"

[project.entry-points."rifferr.ai_providers"]
anthropic = "rifferr.ai.providers.anthropic:AnthropicProvider"
"openai-compatible" = "rifferr.ai.providers.openai_compat:OpenAICompatibleProvider"

[project.entry-points."rifferr.cover_providers"]
coverartarchive = "rifferr.covers.providers:CoverArtArchive"
itunes = "rifferr.covers.providers:ITunes"
deezer = "rifferr.covers.providers:Deezer"
local = "rifferr.covers.providers:LocalFiles"
discogs = "rifferr.covers.providers:Discogs"
fanarttv = "rifferr.covers.providers:FanartTv"

[project.entry-points."rifferr.image_resizers"]
pillow = "rifferr.covers.resize:PillowResizer"

[project.entry-points."rifferr.backends"]
beets = "rifferr.backends.beets:from_profile"

[project.entry-points."rifferr.template_functions"]
ifgreater = "rifferr.tagscript.functions:ifgreater"
unpad = "rifferr.tagscript.functions:unpad"
startswith = "rifferr.tagscript.functions:startswith"
genre_root = "rifferr.backends.beets.genres:genre_root"

[tool.uv.build-backend]
# beets finds plugins as beetsplug.<name>: ship the rifferr plugin shim (C-TEMPLATE-FUNCTIONS).
module-name = ["rifferr", "beetsplug.rifferr"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# Pure layers are type-checked strictly (AGENTS.md "Layout").
strict = ["src/rifferr/core", "src/rifferr/engine", "src/rifferr/tagscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
